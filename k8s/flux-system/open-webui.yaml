apiVersion: kustomize.toolkit.fluxcd.io/v1
kind: Kustomization
metadata:
  name: open-webui
  namespace: flux-system
spec:
  dependsOn:
    - name: alloy
    - name: tailscale
    - name: secrets
  interval: 10m
  retryInterval: 1m
  path: ./k8s/open-webui
  prune: true
  sourceRef:
    kind: GitRepository
    name: flux-system
  timeout: 10m
  wait: true
