apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: open-webui-data
  namespace: open-webui
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 20Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: open-webui
  namespace: open-webui
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: open-webui
  template:
    metadata:
      labels:
        app: open-webui
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      nodeSelector:
        kubernetes.io/hostname: vermilion
      securityContext:
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: open-webui
          image: ghcr.io/open-webui/open-webui:v0.12.4@sha256:a5b9e403d19154796850679c8c5d1295301cee954be8b84ddd62af92426558f7
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - NET_RAW
          env:
            - name: VERMILION_IP
              valueFrom:
                fieldRef:
                  fieldPath: status.hostIP
            - name: OLLAMA_BASE_URL
              value: http://$(VERMILION_IP):11434
            - name: WEBUI_AUTH
              value: "true"
            - name: ENABLE_SIGNUP
              value: "false"
            - name: ENABLE_API_KEYS
              value: "true"
            - name: ENABLE_API_KEYS_ENDPOINT_RESTRICTIONS
              value: "true"
            - name: API_KEYS_ALLOWED_ENDPOINTS
              value: /api/models,/api/chat/completions
            - name: CHAT_RESPONSE_STREAM_DELTA_CHUNK_SIZE
              value: "1"
            - name: ENABLE_OTEL
              value: "true"
            - name: ENABLE_OTEL_METRICS
              value: "true"
            - name: ENABLE_OTEL_TRACES
              value: "false"
            - name: ENABLE_OTEL_LOGS
              value: "false"
            - name: OTEL_SERVICE_NAME
              value: open-webui
            - name: OTEL_RESOURCE_ATTRIBUTES
              value: cluster=kanto
            - name: OTEL_METRICS_EXPORTER_OTLP_ENDPOINT
              value: http://alloy.alloy-system.svc.cluster.local:4317
            - name: OTEL_METRICS_EXPORTER_OTLP_INSECURE
              value: "true"
            - name: OTEL_METRICS_OTLP_SPAN_EXPORTER
              value: grpc
            - name: OTEL_METRICS_EXPORT_INTERVAL_MILLIS
              value: "30000"
            - name: ENABLE_PERSISTENT_CONFIG
              value: "false"
            - name: ENABLE_WEB_SEARCH
              value: "true"
            - name: WEB_SEARCH_ENGINE
              value: duckduckgo
            - name: ENABLE_OPENAI_API
              value: "true"
            - name: OPENAI_API_BASE_URL
              value: http://$(VERMILION_IP):13305/api/v1
            - name: OPENAI_API_KEY
              value: unused
            - name: ENABLE_OLLAMA_API
              value: "true"
            - name: WEBUI_URL
              value: https://openwebui.narwhal-snapper.ts.net
            - name: TERMINAL_SERVER_CONNECTIONS
              valueFrom:
                secretKeyRef:
                  name: open-terminal
                  key: TERMINAL_SERVER_CONNECTIONS
            - name: TZ
              value: America/New_York
          envFrom:
            - secretRef:
                name: open-webui
          ports:
            - name: http
              containerPort: 8080
          resources:
            requests:
              cpu: 500m
              memory: 512Mi
            limits:
              memory: 4Gi
          startupProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
          volumeMounts:
            - name: data
              mountPath: /app/backend/data
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: open-webui-data
---
apiVersion: v1
kind: Service
metadata:
  name: open-webui
  namespace: open-webui
spec:
  type: ClusterIP
  selector:
    app: open-webui
  ports:
    - name: http
      port: 80
      targetPort: http
